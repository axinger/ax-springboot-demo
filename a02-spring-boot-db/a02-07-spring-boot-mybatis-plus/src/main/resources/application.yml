server:
  port: 12007

spring:
  profiles:
    #    active: mysql
    active: pgsql
  datasource:
    hikari:
      # 获取连接的超时时间（毫秒）
      # - 当连接池无可用连接时，客户端等待连接的最大时间
      # - 超过此时间仍未获取到连接，将抛出 SQLException
      # - 生产环境建议：2000-30000（根据业务容忍度调整）
      # - 默认值：30000 (30秒)
      connection-timeout: 30000

      # 空闲连接超时时间（毫秒）
      # - 连接在池中保持空闲而不被使用的最长时间
      # - 超过此时间的空闲连接将被关闭并从池中移除
      # - 必须小于 max-lifetime
      # - 不能小于 10000（10秒），否则会被重置为默认值
      # - 默认值：600000 (10分钟)
      # - 注意：在 PostgreSQL 中，此值应小于数据库的 idle_in_transaction_session_timeout
      idle-timeout: 600000

      # 连接最大生命周期（毫秒）
      # - 连接在池中的最长存活时间，无论是否被使用
      # - 到达此时间后，连接将被关闭并创建新连接替代
      # - 用于解决数据库服务器端强制断开长时间连接的问题
      # - 应设置为略小于数据库 wait_timeout 参数
      # - 默认值：1800000 (30分钟)
      # - 建议：对于 PostgreSQL 通常设置为 30 分钟（1800000）
      max-lifetime: 1800000

      # 连接池最大连接数
      # - 池中允许的最大连接数（活跃+空闲）
      # - 过高会导致数据库资源耗尽，过低会导致应用吞吐量下降
      # - 计算公式：((核心数 * 2) + 有效磁盘数) 是一个起点
      # - Web 应用一般公式：((核心数 * 2) + 有效磁盘数) * 请求等待时间/处理时间
      # - 默认值：10
      # - 生产建议：
      #   * 小型应用：5-10
      #   * 中型应用：10-20
      #   * 大型应用：20-50（需配合数据库连接数调整）
      # - 重要：此值不应超过数据库 max_connections 的 75%
      maximum-pool-size: 10

      # 附加推荐配置（可选）：
      #   # 连接最小空闲数（默认与maximum-pool-size相同）
      #   minimum-idle: 3
      #
      #   # 连接测试查询（PostgreSQL 推荐使用以下查询）
      #   connection-test-query: SELECT 1
      #
      #   # 初始化连接数（应用启动时创建的连接数）
      #   initialization-fail-timeout: 1
      #
      #   # 是否自动提交（通常由Spring事务管理，建议false）
      #   auto-commit: false

mybatis-plus:
  global-config:
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0
