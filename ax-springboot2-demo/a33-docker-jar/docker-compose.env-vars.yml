# ===========================================================================
# 方案三：环境变量优先docker-compose编排文件
# 使用场景：云原生环境，符合12-Factor App原则
# ===========================================================================

version: '3.8'

services:
  a33-docker-jar:
    # 使用环境变量方案的Dockerfile
    build:
      context: .
      dockerfile: Dockerfile-env-vars

    container_name: a33-docker-jar-env

    # 环境变量配置（所有配置通过环境变量注入）
    environment:
      # Spring Boot配置
      - SPRING_PROFILES_ACTIVE=prd
      - SERVER_PORT=13301
      - SERVER_CONTEXT_PATH=/axinger

      # 应用配置
      - APP_NAME=a33-docker-jar
      - APP_VERSION=2.0.0
      - APP_DESCRIPTION=生产环境应用

      # 日志配置
      - LOG_LEVEL_ROOT=WARN
      - LOG_LEVEL_APP=INFO
      - LOG_FILE=/var/log/a33-docker-jar/application.log

      # 管理端点配置
      - MANAGEMENT_ENDPOINTS=health,info,metrics
      - HEALTH_SHOW_DETAILS=when_authorized

    # 从.env文件加载敏感环境变量
    env_file:
      - .env.production

    ports:
      - "13301:13301"

    # 只挂载日志目录（无配置文件挂载）
    volumes:
      - ./docker/logs:/var/log/a33-docker-jar

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13301/axinger/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

    restart: unless-stopped

    networks:
      - app-network

networks:
  app-network:
    driver: bridge