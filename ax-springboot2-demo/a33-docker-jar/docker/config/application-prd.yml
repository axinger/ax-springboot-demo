# Redis配置示例
# spring:
#   redis:
#     host: ${REDIS_HOST:localhost}
#     port: ${REDIS_PORT:6379}
#     password: ${REDIS_PASSWORD:}
#     timeout: 3000ms

# 应用特定配置
app:
  features:
    enable-cache: true
    enable-metrics: true
  security:
    api-key-required: true