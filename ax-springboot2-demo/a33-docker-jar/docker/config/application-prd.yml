# ===========================================================================
# 生产环境外部配置文件
# 位置：docker/config/application-prd.yml
# 说明：此文件会被挂载到容器内的/app/config/目录
# ===========================================================================

# 服务器配置
server:
  port: ${SERVER_PORT:13301}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  http2:
    enabled: true
  servlet:
    session:
      timeout: 30m

# Spring应用配置
spring:
  application:
    version: ${APP_VERSION:2.0.0}
    description: ${APP_DESCRIPTION:生产环境应用}
    debug: false
  main:
    banner-mode: off

# 日志配置
logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.github.axinger: ${LOG_LEVEL_APP:INFO}
    org.springframework: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
    metrics:
      enabled: true

# 缓存配置
spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

# 数据库配置示例（使用环境变量注入）
