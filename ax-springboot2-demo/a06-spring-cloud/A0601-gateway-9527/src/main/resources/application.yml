server:
  servlet:
    context-path: /
  port: 9527

spring:
  main:
    web-application-type: reactive
  application:
    name: cloud-service-gateway
  redis:
    host: localhost
    port: 16379
    database: 1
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 2000ms
  cloud:
    #网关
    gateway: #routes:#路由配置:参数为一个List
      # 全局CORS配置
#      globalcors:
#        cors-configurations:
#          '[/**]':
#            allowed-origin-patterns: "*"
#            allowed-methods: "*"
#            allowed-headers: "*"
#            allow-credentials: true
      # 默认过滤器配置
      default-filters:
#        # 全局限流配置
        - name: RequestRateLimiter
          args:
            #                key-resolver: "#{@ipKeyResolver}"
            #                key-resolver: "#{@pathKeyResolver}"
            key-resolver: "#{@ipAndPathKeyResolver}"
            # ⚠️ 删除下面两行！
            redis-rate-limiter.replenishRate: 1
            redis-rate-limiter.burstCapacity: 1
#        # 重试配置
#        - name: Retry
#          args:
#            retries: 3
#            statuses: BAD_GATEWAY
      routes:
        - id: payment_rout_1 #唯一标识
          uri: http://localhost:10602/ #转发的地址,写服务名称
#          uri: lb://cloud-service-payment #转发的地址,写服务名称
          predicates:
            - Path=/payment/** #判断匹配条件,即地址带有/ribbon/**的请求,会转发至lb:RIBBON-CONSUMER
#          filters:
#            - name: RequestRateLimiter
#              args:
##                key-resolver: "#{@ipKeyResolver}"
#                key-resolver: "#{@pathKeyResolver}"
#                redis-rate-limiter.replenishRate: 1
#                redis-rate-limiter.burstCapacity: 2
#          filters:
#            - name: RequestRateLimiter
#              args:
##                key-resolver: "#{@ipKeyResolver}"
##                key-resolver: "#{@pathKeyResolver}"
#                key-resolver: "#{@ipAndPathKeyResolver}"
#                # ⚠️ 删除下面两行！
#                redis-rate-limiter.replenishRate: 1
#                redis-rate-limiter.burstCapacity: 1
#                # ✅ 改为引用 Bean
##                rate-limiter: "#{@defaultRateLimiter}"

        - id: payment_rout_2
          uri: http://localhost:8090/
          predicates:
            - Path=/payment/lb/**
#          filters:
#            - name: RequestRateLimiter
#              args:
#                # 从配置类中获取 KeyResolver Bean 名称
#                key-resolver: '#{@ipKeyResolver}'
#                # Redis 限流的阈值（令牌桶容量/请求次数）
#                redis-rate-limiter.replenishRate: 10
#                redis-rate-limiter.burstCapacity: 20
#                # 这里的配置取决于你自定义的 RateLimiter 实现，也可以直接使用官方的
logging:
  level:
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
