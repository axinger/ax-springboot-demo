<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务中心</title>
    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .task-container {
            margin: 20px auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .section-title {
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #0d6efd;
        }
        .task-card {
            transition: transform 0.2s;
        }
        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-weight: bold;
        }
        .nav-link {
            cursor: pointer;
        }
        /* 添加模态框样式 */
        .modal-content {
            border-radius: 10px;
        }
        .top-nav {
            background-color: #e9ecef;
            padding: 10px 0;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Flowable 工作流系统</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3" id="currentUser">欢迎，<span id="username"></span></span>
            <button class="btn btn-outline-light" id="logoutBtn">退出登录</button>
        </div>
    </div>
</nav>

<!-- 顶部导航 -->
<div class="top-nav">
    <div class="container">
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link active" href="/task">任务中心</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/process-management">流程管理</a>
            </li>
        </ul>
    </div>
</div>

<div class="container-fluid task-container">
    <h1 class="text-center mb-4">任务中心</h1>

    <!-- 可填写的流程 -->
    <div class="section">
        <h3 class="section-title">可申请的流程</h3>
        <div class="row" id="availableProcessesContainer">
            <!-- 动态加载可申请的流程 -->
        </div>
    </div>

    <hr>

    <!-- 我申请的流程 -->
    <div class="section">
        <h3 class="section-title">我申请的流程</h3>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-primary">
                <tr>
                    <th>流程实例ID</th>
                    <th>流程名称</th>
                    <th>开始时间</th>
                    <th>状态</th>
                    <th>业务标识</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="myApplicationsContainer">
                    <!-- 动态加载我申请的流程 -->
                </tbody>
            </table>
        </div>
    </div>

    <hr>

    <!-- 待我审批 -->
    <div class="section">
        <h3 class="section-title">待我审批</h3>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-warning">
                <tr>
                    <th>任务ID</th>
                    <th>任务名称</th>
                    <th>流程实例ID</th>
                    <th>创建时间</th>
                    <th>状态</th>
                    <th>描述</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="pendingApprovalsContainer">
                    <!-- 动态加载待审批任务 -->
                </tbody>
            </table>
        </div>
    </div>

    <hr>

    <!-- 已完结的任务 -->
    <div class="section">
        <h3 class="section-title">已完结的任务</h3>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-success">
                <tr>
                    <th>任务ID</th>
                    <th>任务名称</th>
                    <th>流程实例ID</th>
                    <th>开始时间</th>
                    <th>结束时间</th>
                    <th>处理人</th>
                    <th>耗时(毫秒)</th>
                </tr>
                </thead>
                <tbody id="finishedTasksContainer">
                    <!-- 动态加载已完结任务 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 请假申请模态框 -->
<div class="modal fade" id="leaveModal" tabindex="-1" aria-labelledby="leaveModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="leaveModalLabel">请假申请</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="leaveForm">
                    <div class="mb-3">
                        <label for="leaveDays" class="form-label">请假天数</label>
                        <input type="number" class="form-control" id="leaveDays" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label for="leaveReason" class="form-label">请假原因</label>
                        <textarea class="form-control" id="leaveReason" rows="3" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="submitLeaveBtn">提交</button>
            </div>
        </div>
    </div>
</div>

<!-- 报销申请模态框 -->
<div class="modal fade" id="reimbursementModal" tabindex="-1" aria-labelledby="reimbursementModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reimbursementModalLabel">报销申请</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="reimbursementForm">
                    <div class="mb-3">
                        <label for="reimbursementAmount" class="form-label">报销金额</label>
                        <input type="number" class="form-control" id="reimbursementAmount" step="0.01" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="reimbursementTitle" class="form-label">报销标题</label>
                        <input type="text" class="form-control" id="reimbursementTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="reimbursementDescription" class="form-label">报销描述</label>
                        <textarea class="form-control" id="reimbursementDescription" rows="3" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="submitReimbursementBtn">提交</button>
            </div>
        </div>
    </div>
</div>

<!-- 审批模态框 -->
<div class="modal fade" id="approvalModal" tabindex="-1" aria-labelledby="approvalModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="approvalModalLabel">审批操作</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="approvalForm">
                    <input type="hidden" id="approvalTaskId">
                    <div class="mb-3">
                        <label class="form-label">审批结果</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="approvalResult" id="approveRadio" value="approve" checked>
                                <label class="form-check-label" for="approveRadio">通过</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="approvalResult" id="rejectRadio" value="reject">
                                <label class="form-check-label" for="rejectRadio">驳回</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="approvalComment" class="form-label">审批意见</label>
                        <textarea class="form-control" id="approvalComment" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="submitApprovalBtn">提交</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    // 当前选中的流程Key
    let selectedProcessKey = '';

    // 页面加载完成后获取任务数据
    document.addEventListener('DOMContentLoaded', function() {
        // 从sessionStorage获取用户信息
        const currentUser = sessionStorage.getItem('currentUser');
        if (currentUser) {
            document.getElementById('username').textContent = currentUser;
        }

        loadTaskData();
    });

    // 加载任务数据
    function loadTaskData() {
        const currentUser = sessionStorage.getItem('currentUser');

        console.log('/api/tasks/dashboard任 currentUser', currentUser)
        fetch('/api/tasks/dashboard?userId='+currentUser)
            .then(response => response.json())
            .then(data => {
                console.log('/api/tasks/dashboard任务数据:', data)
                renderAvailableProcesses(data.availableProcesses);
                renderMyApplications(data.myApplications);
                renderPendingApprovals(data.pendingApprovals);
                renderFinishedTasks(data.finishedTasks);
            })
            .catch(error => {
                console.error('获取任务数据失败:', error);
                alert('获取任务数据失败，请刷新页面重试');
            });
    }

    // 渲染可申请的流程
    function renderAvailableProcesses(processes) {
        const container = document.getElementById('availableProcessesContainer');
        container.innerHTML = '';

        if (!processes || processes.length === 0) {
            container.innerHTML = '<p class="text-muted">暂无可申请的流程</p>';
            return;
        }

        processes.forEach(process => {
            const col = document.createElement('div');
            col.className = 'col-md-4 mb-3';
            col.innerHTML = `
                <div class="card task-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">${process.name || '未命名流程'}</h5>
                        <p class="card-text">
                            <small class="text-muted">版本: ${process.version}</small><br>
                            <small class="text-muted">Key: ${process.key}</small>
                        </p>
                        <button class="btn btn-primary" onclick="applyForProcess('${process.key}')">申请</button>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
    }

    // 渲染我申请的流程
    function renderMyApplications(applications) {
        const container = document.getElementById('myApplicationsContainer');
        container.innerHTML = '';

        if (!applications || applications.length === 0) {
            const row = document.createElement('tr');
            row.innerHTML = '<td colspan="5" class="text-center text-muted">暂无申请的流程</td>';
            container.appendChild(row);
            return;
        }

        applications.forEach(app => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${app.id}</td>
                <td>${app.processDefinitionName || '未知流程'}</td>
                <td>${formatDate(app.startTime)}</td>
                <td>
                    <span class="badge ${app.status === '运行中' ? 'bg-warning' : 'bg-success'}">
                        ${app.status}
                    </span>
                </td>
                <td>${app.businessKey || '-'}</td>
                  <td>
                 <button class="btn btn-primary" onclick="submitForApproval('${app.id}')">提交申请</button>
                 </td>
            `;
            container.appendChild(row);
        });
    }

    // 渲染待审批任务
    function renderPendingApprovals(tasks) {
        const container = document.getElementById('pendingApprovalsContainer');
        container.innerHTML = '';

        if (!tasks || tasks.length === 0) {
            const row = document.createElement('tr');
            row.innerHTML = '<td colspan="7" class="text-center text-muted">暂无待审批任务</td>';
            container.appendChild(row);
            return;
        }

        tasks.forEach(task => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${task.id}</td>
                <td>${task.name || '未命名任务'}</td>
                <td>${task.processInstanceId}</td>
                <td>${formatDate(task.createTime)}</td>
                <td>
                    <span class="badge ${task.status === '指派给我' ? 'bg-warning' : 'bg-info'}">
                        ${task.status}
                    </span>
                </td>
                <td>${task.description || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="showApprovalModal('${task.id}')">审批</button>
                </td>
            `;
            container.appendChild(row);
        });
    }

    // 渲染已完结任务
    function renderFinishedTasks(tasks) {
        const container = document.getElementById('finishedTasksContainer');
        container.innerHTML = '';

        if (!tasks || tasks.length === 0) {
            const row = document.createElement('tr');
            row.innerHTML = '<td colspan="7" class="text-center text-muted">暂无已完结任务</td>';
            container.appendChild(row);
            return;
        }

        tasks.forEach(task => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${task.id}</td>
                <td>${task.name || '未命名任务'}</td>
                <td>${task.processInstanceId}</td>
                <td>${formatDate(task.startTime)}</td>
                <td>${formatDate(task.endTime)}</td>
                <td>${task.assignee || '-'}</td>
                <td>${task.durationInMillis || '-'}</td>
            `;
            container.appendChild(row);
        });
    }

    // 格式化日期
    function formatDate(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        return date.toLocaleString('zh-CN');
    }

    // 申请流程
    function applyForProcess(processKey) {
        selectedProcessKey = processKey;

        if (processKey === 'employeeLeave') {
            // 显示请假申请模态框
            const leaveModal = new bootstrap.Modal(document.getElementById('leaveModal'));
            leaveModal.show();
        } else if (processKey === 'expenseReimbursement') {
            // 显示报销申请模态框
            const reimbursementModal = new bootstrap.Modal(document.getElementById('reimbursementModal'));
            reimbursementModal.show();
        } else {
            alert(`申请流程: ${processKey}\n此功能需根据具体业务实现`);
        }
    }

    // 提交请假申请
    document.getElementById('submitLeaveBtn').addEventListener('click', function() {
        const days = document.getElementById('leaveDays').value;
        const reason = document.getElementById('leaveReason').value;

        if (!days || !reason) {
            alert('请填写完整信息');
            return;
        }

        fetch('/api/leave-view/apply', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `days=${encodeURIComponent(days)}&reason=${encodeURIComponent(reason)}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('请假申请提交成功');
                // 关闭模态框
                const leaveModal = bootstrap.Modal.getInstance(document.getElementById('leaveModal'));
                leaveModal.hide();
                // 重新加载数据
                loadTaskData();
            } else {
                alert('请假申请提交失败: ' + data.message);
            }
        })
        .catch(error => {
            console.error('提交请假申请失败:', error);
            alert('提交请假申请失败');
        });
    });

    // 提交报销申请
    document.getElementById('submitReimbursementBtn').addEventListener('click', function() {
        const amount = document.getElementById('reimbursementAmount').value;
        const title = document.getElementById('reimbursementTitle').value;
        const description = document.getElementById('reimbursementDescription').value;

        if (!amount || !title || !description) {
            alert('请填写完整信息');
            return;
        }

        const formData = new FormData();
        formData.append('amount', amount);
        formData.append('title', title);
        formData.append('description', description);

        fetch('/api/reimbursement-view/apply', {
            method: 'POST',
            body: new URLSearchParams(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('报销申请提交成功');
                // 关闭模态框
                const reimbursementModal = bootstrap.Modal.getInstance(document.getElementById('reimbursementModal'));
                reimbursementModal.hide();
                // 重新加载数据
                loadTaskData();
            } else {
                alert('报销申请提交失败: ' + data.message);
            }
        })
        .catch(error => {
            console.error('提交报销申请失败:', error);
            alert('提交报销申请失败');
        });
    });

    // 提交审批
    document.getElementById('submitApprovalBtn').addEventListener('click', function() {
        const taskId = document.getElementById('approvalTaskId').value;
        const approved = document.querySelector('input[name="approvalResult"]:checked').value === 'approve';
        const comment = document.getElementById('approvalComment').value;

        // 判断是哪种类型的审批（请假还是报销）
        let url = `/api/leave-view/approve/${taskId}`;
        if (currentApprovalTaskType === 'reimbursement') {
            url = `/api/reimbursement-view/approve/${taskId}`;
        }

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `approved=${approved}&comment=${encodeURIComponent(comment)}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('审批操作完成');
                // 关闭模态框
                const approvalModal = bootstrap.Modal.getInstance(document.getElementById('approvalModal'));
                approvalModal.hide();
                // 重新加载数据
                loadTaskData();
            } else {
                alert('审批操作失败: ' + data.message);
            }
        })
        .catch(error => {
            console.error('审批操作失败:', error);
            alert('审批操作失败');
        });
    });

    // 为我申请的流程提交审批
    function submitForApproval(processInstanceId) {
        const currentUser = sessionStorage.getItem('currentUser');
        if (!currentUser) {
            alert('用户未登录');
            return;
        }

        // 调用后端API提交审批
        fetch('/api/tasks/submit-for-approval', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `processInstanceId=${encodeURIComponent(processInstanceId)}&userId=${encodeURIComponent(currentUser)}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('流程已提交审批');
                loadTaskData();
            } else {
                alert('提交审批失败: ' + data.message);
            }
        })
        .catch(error => {
            console.error('提交审批失败:', error);
            alert('提交审批失败');
        });
    }

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', function() {
        fetch('/api/logout', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                sessionStorage.removeItem('currentUser');
                window.location.href = '/login';
            } else {
                alert('退出登录失败: ' + data.message);
            }
        })
        .catch(error => {
            console.error('退出登录请求失败:', error);
            alert('退出登录请求失败');
        });
    });
    
    // 当前审批任务类型（默认为leave，也可以是reimbursement）
    let currentApprovalTaskType = 'leave';
    
    // 显示审批模态框
    function showApprovalModal(taskId, taskType = 'leave') {
        currentApprovalTaskType = taskType;
        document.getElementById('approvalTaskId').value = taskId;
        const approvalModal = new bootstrap.Modal(document.getElementById('approvalModal'));
        approvalModal.show();
    }

    // 查看任务详情
    function viewTaskDetails(taskId) {
        fetch(`/api/reimbursement-view/task/${taskId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 显示任务详情模态框
                    showTaskDetailsModal(data.task, data.processVariables);
                } else {
                    alert('获取任务详情失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('获取任务详情失败:', error);
                alert('获取任务详情失败');
            });
    }

    // 显示任务详情模态框
    function showTaskDetailsModal(task, processVariables) {
        // 更新模态框内容
        document.getElementById('approvalModalLabel').textContent = '审批操作 - ' + task.name;
        
        // 显示任务信息
        let taskInfoHtml = `
            <div class="mb-3">
                <h6>任务信息</h6>
                <p><strong>任务名称:</strong> ${task.name}</p>
                <p><strong>创建时间:</strong> ${formatDate(task.createTime)}</p>
            </div>
            <div class="mb-3">
                <h6>报销信息</h6>
                <p><strong>报销金额:</strong> ${processVariables.amount}</p>
                <p><strong>报销标题:</strong> ${processVariables.title}</p>
                <p><strong>报销描述:</strong> ${processVariables.description}</p>
                <p><strong>申请人:</strong> ${processVariables.applicant}</p>
            </div>
        `;
        
        // 更新表单内容
        document.querySelector('#approvalForm .modal-body').innerHTML = taskInfoHtml + document.querySelector('#approvalForm .modal-body').innerHTML;
        
        // 显示模态框
        const approvalModal = new bootstrap.Modal(document.getElementById('approvalModal'));
        approvalModal.show();
    }
</script>
</body>
</html>
