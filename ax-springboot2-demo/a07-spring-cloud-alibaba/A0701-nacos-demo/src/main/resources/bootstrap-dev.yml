server:
  port: 10801
  servlet:
    context-path: /a0701-nacos-demo
spring:
  application:
    name: a0701-nacos-demo
  cloud:
    nacos:
      #配置中心
      config:
        enabled: true # 默认开启
        server-addr: http://localhost:8848
        username: nacos
        password: nacos
        # 默认一个文件，也可以指定
        prefix: ${spring.application.name}
        #        prefix: all
        refresh-enabled: true
        file-extension: yml
        group: DEFAULT_GROUP
        namespace: dev
        #        shared-configs:
        #          - # 配置文件名-Data Id
        #          - data-id: 'a0701-nacos-demo.yaml'
        #            # 默认为DEFAULT_GROUP
        #            group: DEFAULT_GROUP
        #            # 是否动态刷新，默认为false
        #            refresh: true
        # 默认加载,通用格式的,再加载其他配置,用以下语法
      #        extension-configs:
      #          - data-id: axinger-user1.yml
      #            group: DEFAULT_GROUP
      #            refresh: true
      #          - data-id: axinger-user2.yml
      #            group: DEFAULT_GROUP
      #            refresh: true
      #          - data-id: axinger-user3.yml
      #            group: DEFAULT_GROUP
      #            refresh: true
      discovery:
        register-enabled: false
        #        server-addr: 127.0.0.1:8848
        server-addr: http://localhost:8848
        username: nacos
        password: nacos
        namespace: dev
        group: DEFAULT_GROUP
  #        enabled: false
#      config:
#        server-addr: @config.server-addr@
#        group: @config.group@
#        namespace: @config.namespace@
#        username: @config.username@
#        password: @config.password@
#      discovery:
#        server-addr: ${spring.cloud.nacos.config.server-addr}
#        group: @config.group@
#        namespace: @config.namespace@
#        username: @config.username@
#        password: @config.password@
  # 在 Spring Cloud Alibaba Nacos 中，使用 spring.config.import 是推荐的配置方式（从 Spring Cloud 2020.0.x 版本开始），
  #替代了之前的 shared-configs 和 extension-configs。
  config:
    import:
      - optional:nacos:axinger-user.yml

