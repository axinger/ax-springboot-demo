server:
  port: 14101

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ax_test41?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Abcd#1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    #    anthropic:
    #      api-key: 这里换成你的api-key
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never #Whether to pull models at startup-time and how.
        timeout: 5m # How long to wait for a model to be pulled.
        max-retries: 0 #Maximum number of retries for the model pull operation.
        chat:
          include: true #Include this type of models in the initialization task.
          additional-models: # Additional models to initialize besides the ones configured via default properties.
            - qwen3:4b
      chat: # Enable Ollama chat model.
        options:
          model: qwen3:4b # The name of the supported model to use.
          format: json # The format to return a response in. Currently, the only accepted value is json
          keep-alive: 5m # Controls how long the model will stay loaded into memory following the request
    mcp:
      client:
        toolcallback:
          enabled: true
        name: mcp-client
#        stdio:
#          servers-configuration: classpath:/mcp-server-config.json # MCP服务配置
        enabled: true
        type: ASYNC
        sse:
          connections:
            author-info-server:
              url: http://localhost:14101
      server:
        enabled: true
        name: stuednt-management-server
        instructions: 你是一个学生信息管理助手，可以帮助用户查询学生信息。
        version: "1.0.0"
        type: SYNC
#        sse-message-endpoint: /mcp/message
