<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 All-in-One - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { font-size: 20px; }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .hero {
            background: white;
            padding: 48px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .hero h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 16px;
        }
        .hero p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 32px;
        }
        .feature-card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .feature-card h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }
        .feature-card p {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>OAuth2 All-in-One 演示</h1>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/messages">消息管理</a>
            <a th:if="${loggedIn}" href="/logout">退出登录</a>
            <span th:if="${loggedIn}" style="margin-left: 20px; font-size: 14px;" th:text="'用户: ' + ${username}"></span>
        </div>
    </div>

    <div class="container">
        <div class="hero">
            <h2>Spring Boot 3 OAuth2 All-in-One</h2>
            <p>
                这是授权服务器和资源服务器的单体合并版本。<br>
                在同一进程中运行，通过表单登录认证，直接访问资源服务。<br>
                端口: 9003
            </p>
            <div th:if="${loggedIn}">
                <p style="color: #667eea; font-weight: 600;">欢迎回来，<span th:text="${username}">用户</span>！</p>
                <a href="/messages" class="btn btn-primary">查看消息</a>
            </div>
            <div th:if="${!loggedIn}">
                <p style="color: #888;">请先登录以使用功能</p>
            </div>
        </div>

        <div class="features">
            <div class="feature-card">
                <h3>授权服务器</h3>
                <p>基于 Spring Authorization Server，支持完整的 OAuth2 授权流程。</p>
            </div>
            <div class="feature-card">
                <h3>资源服务器</h3>
                <p>提供受保护的 REST API，支持 JWT 令牌验证和方法级权限控制。</p>
            </div>
            <div class="feature-card">
                <h3>单体部署</h3>
                <p>单进程运行，适合快速演示和开发测试，无需多服务协调。</p>
            </div>
        </div>
    </div>
</body>
</html>
