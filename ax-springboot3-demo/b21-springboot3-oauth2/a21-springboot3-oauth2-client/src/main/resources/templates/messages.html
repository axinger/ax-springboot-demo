<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息管理 - OAuth2 客户端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { font-size: 20px; }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        .container {
            max-width: 900px;
            margin: 32px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .btn-submit {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            color: #888;
            font-weight: 500;
            background: #f8f9fa;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .badge-normal { background: #e0e7ff; color: #4338ca; }
        .badge-urgent { background: #fee2e2; color: #b91c1c; }
        .badge-published { background: #d1fae5; color: #047857; }
        .badge-draft { background: #fef3c7; color: #b45309; }
        .error-msg {
            color: #e74c3c;
            padding: 12px;
            background: #fdf2f2;
            border-radius: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>OAuth2 客户端演示</h1>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/messages">消息管理</a>
            <a href="/user">用户信息</a>
            <a href="/logout">退出登录</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>创建新消息</h2>
            <form action="/messages" method="post">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" name="title" placeholder="请输入消息标题" required>
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea name="content" placeholder="请输入消息内容" required></textarea>
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select name="messageType">
                        <option value="NORMAL">普通</option>
                        <option value="URGENT">紧急</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">创建消息</button>
            </form>
        </div>

        <div class="card">
            <h2>消息列表</h2>
            <div th:if="${error}" class="error-msg" th:text="${error}"></div>
            <table th:if="${messages}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>标题</th>
                        <th>类型</th>
                        <th>状态</th>
                        <th>作者ID</th>
                        <th>创建时间</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="msg : ${messages}">
                        <td th:text="${msg.id}">1</td>
                        <td th:text="${msg.title}">标题</td>
                        <td>
                            <span class="badge" th:classappend="${msg.messageType == 'URGENT'} ? 'badge-urgent' : 'badge-normal'" th:text="${msg.messageType}">NORMAL</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${msg.status == 'PUBLISHED'} ? 'badge-published' : 'badge-draft'" th:text="${msg.status}">PUBLISHED</span>
                        </td>
                        <td th:text="${msg.authorId}">1</td>
                        <td th:text="${msg.createTime}">2024-01-01</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
