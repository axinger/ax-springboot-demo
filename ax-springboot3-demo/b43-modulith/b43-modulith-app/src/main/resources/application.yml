spring:
  application:
    name: b43-modulith
  main:
    allow-bean-definition-overriding: true

  # 数据库配置
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # 邮件配置（用于通知模块）
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Spring Modulith 配置
spring.modulith:
  events:
    jdbc:
      schema-initialization:
        enabled: true
  actuator:
    enabled: true

# Swagger/OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 订单模块
        url: /v3/api-docs/orders
      - name: 客户模块
        url: /v3/api-docs/customers
      - name: 库存模块
        url: /v3/api-docs/inventory
      - name: 支付模块
        url: /v3/api-docs/payments
      - name: 通知模块
        url: /v3/api-docs/notifications
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  disable-swagger-default-url: true
  # 模块化 API 分组配置
  group-configs:
    - group: orders
      paths-to-match: /api/orders/**
      packages-to-scan: com.axinger.order
    - group: customers
      paths-to-match: /api/customers/**
      packages-to-scan: com.axinger.customer
    - group: inventory
      paths-to-match: /api/inventory/**
      packages-to-scan: com.axinger.inventory
    - group: payments
      paths-to-match: /api/payments/**
      packages-to-scan: com.axinger.payment
    - group: notifications
      paths-to-match: /api/notifications/**
      packages-to-scan: com.axinger.notification

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    com.axinger: DEBUG
    org.springframework.modulith: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator 端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: always
    modulith:
      enabled: true