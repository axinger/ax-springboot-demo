spring:
  application:
    name: b43-modulith
  main:
    allow-bean-definition-overriding: true

  # 数据库配置
  datasource:
    # 方案1: H2 文件数据库（开发/测试推荐）
    url: jdbc:h2:file:./data/modulith_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456
    
    # 方案2: MySQL（生产推荐）- 取消注释使用
    # url: jdbc:mysql://localhost:3306/modulith_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: root
    # password: your_password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  # SQL 初始化配置
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # 邮件配置（用于通知模块）
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Spring Modulith 配置
spring.modulith:
  events:
    jdbc:
      schema-initialization:
        enabled: true  # 自动创建 EVENT_PUBLICATION 表
    
    # 事件完成模式（1.3+）
    # UPDATE: 标记完成日期（默认）
    # DELETE: 完成后直接删除记录
    # ARCHIVE: 归档到archive表
    completion-mode: UPDATE
  actuator:
    enabled: true

# Swagger/OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 订单模块
        url: /v3/api-docs/orders
      - name: 客户模块
        url: /v3/api-docs/customers
      - name: 库存模块
        url: /v3/api-docs/inventory
      - name: 支付模块
        url: /v3/api-docs/payments
      - name: 通知模块
        url: /v3/api-docs/notifications
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  disable-swagger-default-url: true
  # 模块化 API 分组配置
  group-configs:
    - group: orders
      paths-to-match: /api/orders/**
      packages-to-scan: com.axinger.order
    - group: customers
      paths-to-match: /api/customers/**
      packages-to-scan: com.axinger.customer
    - group: inventory
      paths-to-match: /api/inventory/**
      packages-to-scan: com.axinger.inventory
    - group: payments
      paths-to-match: /api/payments/**
      packages-to-scan: com.axinger.payment
    - group: notifications
      paths-to-match: /api/notifications/**
      packages-to-scan: com.axinger.notification

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    com.axinger: DEBUG
    org.springframework.modulith: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator 端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith,env
  endpoint:
    health:
      show-details: always
    modulith:
      enabled: true
    env:
      show-values: when-authorized  # 生产环境隐藏敏感信息
  
  # 健康检查配置
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10MB